<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constructable Stylesheets Benchmark</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .results {
      border: 1px solid #ccc;
      padding: 1rem;
      background: #f5f5f5;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 600px;
      overflow-y: auto;
    }
    .benchmark-container {
      display: none;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      border: 1px solid #ddd;
      padding: 1rem;
      border-radius: 4px;
    }
    .stat-card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 0.875rem;
      color: #666;
      text-transform: uppercase;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
    }
    .stat-card .unit {
      font-size: 0.875rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Constructable Stylesheets vs Traditional CSS Benchmark</h1>

  <div class="controls">
    <button onclick="runBenchmark('constructable', 100)">Constructable: 100 Components</button>
    <button onclick="runBenchmark('constructable', 500)">Constructable: 500 Components</button>
    <button onclick="runBenchmark('constructable', 1000)">Constructable: 1000 Components</button>
    <button onclick="runBenchmark('traditional', 100)">Traditional: 100 Components</button>
    <button onclick="runBenchmark('traditional', 500)">Traditional: 500 Components</button>
    <button onclick="runBenchmark('traditional', 1000)">Traditional: 1000 Components</button>
    <button onclick="runMemoryComparison()">Memory Comparison</button>
    <button onclick="runThemeSwitchBenchmark()">Theme Switch Speed</button>
    <button onclick="clearResults()">Clear Results</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>
  <div class="benchmark-container" id="container"></div>

  <script src="./benchmark.js"></script>
</body>
</html>
